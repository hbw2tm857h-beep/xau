# Cloudflare Worker for the LumnFx Discord app (slash commands).
# Deploy from this folder: npx wrangler deploy
# The bot token is a secret: npx wrangler secret put DISCORD_BOT_TOKEN
name = "lumnfx-bot"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[vars]
DISCORD_APP_ID = ""        # from the developer portal, General Information
DISCORD_PUBLIC_KEY = ""    # from the developer portal, General Information (public, not a secret)
GUILD_ID = "1573090531838402742"
