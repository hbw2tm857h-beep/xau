name: Economic calendar

# Posts the week's high-impact US releases to #economic-calendar on Sunday
# evening, and a reminder on weekday mornings when something is due that day.
# The metronome starts these on time (Sunday 20:06 and weekdays 06:06 UTC); the
# schedule below is the backup, since GitHub's own schedule can run late or not
# at all. calendar_posted.json stops the same post going out twice.
on:
  schedule:
    - cron: "15 20 * * 0"      # Sunday 20:15 UTC: the week ahead
    - cron: "30 6 * * 1-5"     # weekdays 06:30 UTC: today's releases
  workflow_dispatch:
    inputs:
      mode:
        description: "week or today"
        default: "week"

concurrency:
  group: calendar
  cancel-in-progress: false

permissions:
  contents: write   # commits calendar.json for the Discord bot's /calendar

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Post the calendar
        env:
          DISCORD_WEBHOOK_CALENDAR: ${{ secrets.DISCORD_WEBHOOK_CALENDAR }}
          MODE: ${{ inputs.mode || (github.event.schedule == '15 20 * * 0' && 'week' || 'today') }}
        run: python3 calendar_post.py "$MODE" --save
      - name: Save the week's releases for the bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.json calendar_posted.json 2>/dev/null || git add calendar.json
          if ! git diff --cached --quiet; then
            git commit -m "Update the economic calendar"
            # Another workflow can push in the same second (the calendar and the
            # 06:06 signal check both do), so rebase and retry rather than lose the state.
            for i in 1 2 3 4 5; do
              git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push --quiet && break
              git rebase --abort 2>/dev/null || true
              [ "$i" = 5 ] && exit 1
              sleep $(( i * 4 ))
            done
          fi
      - name: Warn if it failed
        if: failure()
        env:
          DISCORD_WEBHOOK_REPORTS: ${{ secrets.DISCORD_WEBHOOK_REPORTS }}
        run: |
          [ -n "${DISCORD_WEBHOOK_REPORTS:-}" ] || exit 0
          curl -fsS -m 20 -H "Content-Type: application/json" \
            -d '{"username":"LumnFx","content":"⚠️ The economic calendar post failed. The Forex Factory feed may be down; check the Economic calendar workflow."}' \
            "$DISCORD_WEBHOOK_REPORTS" || true
