name: Fetch gold history

# Downloads hourly XAUUSD candles from Dukascopy's free historical feed into
# data/xauusd_h1.csv for research and backtests. Run manually.
on:
  workflow_dispatch:
    inputs:
      from:
        description: "Start date (yyyy-mm-dd)"
        required: true
        default: "2016-01-01"

permissions:
  contents: write

concurrency:
  group: xau-signals
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Download H1 candles year by year
        run: |
          set -e
          mkdir -p dl data
          START_YEAR=$(echo "${{ github.event.inputs.from }}" | cut -d- -f1)
          THIS_YEAR=$(date -u +%Y)
          for Y in $(seq "$START_YEAR" "$THIS_YEAR"); do
            FROM="$Y-01-01"; TO="$((Y+1))-01-01"
            [ "$Y" = "$START_YEAR" ] && FROM="${{ github.event.inputs.from }}"
            [ "$Y" = "$THIS_YEAR" ] && TO="now"
            echo "== $Y"
            npx --yes dukascopy-node@1 -i xauusd -from "$FROM" -to "$TO" -t h1 -f csv \
              -dir "dl/$Y" -s -r 3 -rp 2000 -bs 5 -bp 1500 --chrome-path "$(which google-chrome || true)"
          done
          python3 - <<'EOF'
          import csv, glob, datetime
          rows = {}
          for path in sorted(glob.glob("dl/*/*.csv")):
              with open(path) as f:
                  for r in csv.DictReader(f):
                      ts = int(r["timestamp"]) // 1000
                      rows[ts] = (r["open"], r["high"], r["low"], r["close"])
          with open("data/xauusd_h1.csv", "w", newline="") as f:
              w = csv.writer(f)
              w.writerow(["time_utc", "open", "high", "low", "close"])
              for ts in sorted(rows):
                  t = datetime.datetime.utcfromtimestamp(ts).strftime("%Y-%m-%d %H:%M")
                  w.writerow([t, *rows[ts]])
          print(len(rows), "rows")
          EOF
      - name: Commit data
        run: |
          git config user.name "xau-signals-bot"
          git config user.email "xau-signals-bot@users.noreply.github.com"
          git add data/xauusd_h1.csv
          git commit -m "Update H1 gold history" || exit 0
          git pull --rebase --quiet origin "${GITHUB_REF_NAME}" || true
          git push
