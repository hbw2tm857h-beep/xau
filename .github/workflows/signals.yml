name: XAU signals

on:
  schedule:
    # A few minutes after each H1 close, every day: gold sleeps at weekends but
    # Bitcoin and Ether don't, and the bot skips gold's closed hours itself.
    # This is the backup; an external scheduler triggers the on-time runs.
    - cron: "7 * * * *"
    # Weekly scorecard, Friday after the close.
    - cron: "37 22 * * 5"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = status message, run = normal check, backtest = replay ~2.5 years, scorecard = weekly results, backfill = rebuild the feature ledger from the history file, gate = judge each strategy's live record"
        required: true
        default: test
        type: choice
        options: [test, run, backtest, scorecard, backfill, gate]

permissions:
  contents: write

concurrency:
  group: xau-signals
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # A run queued behind another must start from the state that one saved,
      # or it could post the same alert twice.
      - name: Pull the latest state
        run: git pull --ff-only --quiet origin "${GITHUB_REF_NAME}" || true

      - name: Run
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TREND: ${{ secrets.SLACK_WEBHOOK_TREND }}
          SLACK_WEBHOOK_INSIDE_DAY: ${{ secrets.SLACK_WEBHOOK_INSIDE_DAY }}
          SLACK_WEBHOOK_BTC: ${{ secrets.SLACK_WEBHOOK_BTC }}
          SLACK_WEBHOOK_ETH: ${{ secrets.SLACK_WEBHOOK_ETH }}
          SLACK_WEBHOOK_US_IBS: ${{ secrets.SLACK_WEBHOOK_US_IBS }}
          SLACK_WEBHOOK_NDX: ${{ secrets.SLACK_WEBHOOK_NDX }}
          SLACK_WEBHOOK_REPORTS: ${{ secrets.SLACK_WEBHOOK_REPORTS }}
          DISCORD_WEBHOOK_GOLD: ${{ secrets.DISCORD_WEBHOOK_GOLD }}
          DISCORD_WEBHOOK_BTC: ${{ secrets.DISCORD_WEBHOOK_BTC }}
          DISCORD_WEBHOOK_ETH: ${{ secrets.DISCORD_WEBHOOK_ETH }}
          DISCORD_WEBHOOK_US_IBS: ${{ secrets.DISCORD_WEBHOOK_US_IBS }}
          DISCORD_WEBHOOK_REPORTS: ${{ secrets.DISCORD_WEBHOOK_REPORTS }}
          ACCOUNT_SIZE: ${{ secrets.ACCOUNT_SIZE }}
          ACCOUNT_CCY: ${{ secrets.ACCOUNT_CCY }}
          RISK_PCT: ${{ secrets.RISK_PCT }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '37 22 * * 5' && 'scorecard') || 'run' }}
        run: python3 signals.py

      - name: Save state, journal and reports
        if: always()
        run: |
          for f in state.json journal.json backtest.md nursery.json \
                   data/ledger.csv data/outcomes.csv data/ledger_backfill.csv.gz; do
            [ -f "$f" ] && git add "$f"
          done
          if ! git diff --cached --quiet; then
            git config user.name "xau-signals-bot"
            git config user.email "xau-signals-bot@users.noreply.github.com"
            git commit -m "Update signal state"
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      # About a minute later, check the run did its job: on time, the latest
      # candle processed for each market, the US ETFs checked after their
      # close, every Slack post delivered. Silent when all is well; a warning
      # in the reports channel when not.
      - name: Verify the signals went out on time
        if: always() && ((github.event_name == 'schedule' && github.event.schedule != '37 22 * * 5') || github.event.inputs.mode == 'run')
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_REPORTS: ${{ secrets.SLACK_WEBHOOK_REPORTS }}
          DISCORD_WEBHOOK_REPORTS: ${{ secrets.DISCORD_WEBHOOK_REPORTS }}
          MODE: verify
        run: |
          sleep 75
          git pull --ff-only --quiet origin "${GITHUB_REF_NAME}" || true
          python3 signals.py
